<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <title>Debug Mode Configuration</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body class="bg-white">
<div>
    <!-- Content -->
    <div id="content" th:fragment="content">
        <!-- Message Display -->
        <div th:if="${message}"
             th:class="${messageType == 'error' ? 'bg-red-50 border-l-4 border-red-500 text-red-700 p-2 my-2' : 'bg-green-50 border-l-4 border-green-500 text-green-700 p-2 my-2'}"
             role="alert">
            <p class="text-sm" th:text="${message}"></p>
        </div>

        <!-- Form -->
        <form class="py-3 space-y-3"
              hx-post="/arcade/ui/debug"
              hx-target="#content"
              hx-swap="outerHTML">

            <!-- Debug Mode Checkbox -->
            <div class="flex items-center">
                <input type="checkbox"
                       id="debugMode"
                       name="debugMode"
                       th:checked="${debugEnabled}"
                       class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                <label for="debugMode" class="ml-2 block text-sm font-medium text-gray-700">
                    Enable Debug Mode
                </label>
            </div>

            <!-- Expiry Minutes Input -->
            <div>
                <label for="expiryMinutes" class="block text-sm font-medium text-gray-700 mb-1">
                    Duration (minutes) <span class="text-red-500 ml-0.5">*</span>
                </label>
                <input type="number"
                       id="expiryMinutes"
                       name="expiryMinutes"
                       value="15"
                       min="1"
                       max="240"
                       required
                       class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-md focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
                <p class="mt-0.5 text-xs text-gray-500">Maximum duration is 240 minutes (4 hours)</p>
            </div>

            <!-- Current Status -->
            <div class="bg-gray-50 p-2 rounded-md">
                <h3 class="text-sm font-medium text-gray-700 mb-1">Current Status</h3>
                <div class="flex items-center mb-1">
                        <span th:class="${debugEnabled ? 'inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800' : 'inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800'}">
                            <span th:text="${debugEnabled ? 'Enabled' : 'Disabled'}"></span>
                        </span>
                    <span class="ml-2 text-xs text-gray-500" th:text="'Last checked: ' + ${now}"></span>
                </div>
                <div th:if="${debugEnabled and remainingSeconds > 0}" class="text-xs text-gray-600">
                    <span class="font-medium">Time remaining:</span>
                    <span th:text="${remainingSeconds >= 60 ? (remainingSeconds / 60) + ' minutes' : remainingSeconds + ' seconds'}"></span>
                </div>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit"
                        class="px-4 py-1.5 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Update Debug Mode
                </button>
            </div>
        </form>
    </div>

    <!-- Footer Info -->
    <div class="pt-2 border-t border-gray-200 mt-2">
        <p class="text-xs text-gray-600">
            <strong>Note:</strong> Debug mode will automatically expire after the specified duration.
        </p>
    </div>
</div>
</body>
</html>
