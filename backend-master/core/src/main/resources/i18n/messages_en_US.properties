MONTH_description=Returns month and year of selected field in format mon yyyy
YEAR_label=YEAR
YEAR_description=Returns year of the selected field in format yyyy.
QUARTER_label=QUARTER
QUARTER_description=Returns a quer of selected field in format  Q<quarter>-yyyy        
WEEKNUM_label=WEEKNUM
WEEKNUM_description=Returns a week of selected field as a number
DAYOFWEEK_label=DAYOFWEEK
DAYOFWEEK_description=Returns day of the week of selected field
AVG_label=AVERAGE
AVG_description=Finds the average value for the given numeric field
MIN_label=MIN
MIN_description=Finds the min value for the given numeric field
MAX_label=MAX
MAX_description=Finds the max value for the given numeric field
PERCENTILE_75_label=PERCENTILE (75)
PERCENTILE_75_description=Finds the 75th percentile value for the given numeric field
PERCENTILE_25_label=PERCENTILE (25)
PERCENTILE_25_description=Finds the 25th percentile value for the given numeric field
MODE_label=MODE
MODE_description=Finds the most frequent value for the given field (arbitrarily choosing the first one if there are multiple equally-frequent results)
STDDEV_POP_label=STANDARD DEVIATION
STDDEV_POP_description=Finds standard deviation for the given field (Considers the entire set of values, with no sampling).Standard deviation is a statistical measure that indicates how much individual data points typically deviate from the mean(or average) of this field, helping to assess the overall variability or spread of the data.
MEDIAN_label=MEDIAN
MEDIAN_description=Finds the median for the given field. The median is the number that is exactly in the middle of a list of numbers arranged from smallest to largest.
VAR_POP_label=VARIANCE
VAR_POP_description=Finds variance for the given field (Considers the entire set of values, with no sampling). Variance is a statistical measure that quantifies how much individual data points in this field differ from the field's mean (or average), providing insight into the data's spread
ADD_label=ADD
ADD_description=Returns the total of all given fields. Accepts two or more numeric fields. This is different from SUM, which sums all values for a given field 
MULTIPLY_label=MULTIPLY
MULTIPLY_description=Returns the result of multiplying all given fields. Accepts two or more numeric fields
REMAINDER_label=REMAINDER
REMAINDER_description=Returns remainder of dividing the first field by the second. Accepts two numeric fields. Use a filter to discard zero values in the second field to avoid errors.
POWER_label=POWER
POWER_description=Returns the result of raising the first field to the power of the second. Accepts two numeric fields
SUBTRACT_label=SUBTRACT
SUBTRACT_description=Returns the difference between given fields. Accepts two or more numeric fields.The result is calculated as (field1 - field2 - field3...)
GROWTH_label=GROWTH
GROWTH_description=Returns the growth of first field relative to second field as a percentage. Growth is defined as 100* (field1 - field2)/field2. The result is rounded to 2 decimals. The function accepts only two parameters
FORMULA_label=FORMULA
FORMULA_description=Returns the results of the formula expression. Select fields using autocomplete and type in the rest of the expression as literals. You can use any valid PostgreSQL expression.
