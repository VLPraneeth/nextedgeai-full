name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Java build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Compile backend and assemble artifacts
        working-directory: backend-master
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      # The inherited connector suite includes credentialed third-party integration
      # tests. Keep CI deterministic with pure regressions for the AWS AI contract
      # and the file/CSV connector; deployed smoke tests cover the full runtime.
      - name: Run hermetic backend regression tests
        working-directory: backend-master
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=com.syncari.utils.CsvUtilsTest,com.syncari.core.service.llm.LLMServiceBedrockTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: npm
          cache-dependency-path: |
            spectrum-master/package-lock.json
            spectrum-master/proxy/package-lock.json

      - name: Install frontend dependencies
        working-directory: spectrum-master
        run: npm ci

      - name: Install proxy dependencies
        working-directory: spectrum-master/proxy
        run: npm ci

      - name: Typecheck
        working-directory: spectrum-master
        run: npm run convert-less-to-ts && npm run tsc -- --noEmit

      - name: Run frontend tests
        working-directory: spectrum-master
        run: npm run test-ci -- --watchAll=false

      - name: Run proxy tests
        working-directory: spectrum-master/proxy
        run: npm test -- --runInBand --passWithNoTests

      - name: Build production frontend and proxy
        working-directory: spectrum-master
        run: npm run proxy-build && npm run build
